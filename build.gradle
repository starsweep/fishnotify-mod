plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the essential Fabric/Mojang maven repos automatically.
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
}

// This mod is client-only (environment: "client" in fabric.mod.json) and
// all its code lives in src/main, so we don't need Loom's
// splitEnvironmentSourceSets() - that's for mods with real client/server
// code separation.

dependencies {
    // Minecraft 26.1+ ships unobfuscated, so there's no mappings dependency
    // and no remapping - mod dependencies use plain implementation/compileOnly
    // instead of the old modImplementation/modCompileOnly configurations.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu integration is optional at runtime (see FishNotifyModMenuApi) -
    // compileOnly resolves its types for us without forcing players to install it.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

// 26.x requires Java 25
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
