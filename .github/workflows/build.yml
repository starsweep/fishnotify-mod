name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          # Fabric Loom's release notes only explicitly confirm Gradle 8.14/9.0 support.
          # If this build fails on a Loom/Gradle mismatch (not a code error), drop
          # gradle-version down to '9.0' and retry before assuming the code is broken.
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/libs/*.jar
        if: always()
      - name: Show errors on failure
        if: failure()
        run: cat build/**/*.log || true
